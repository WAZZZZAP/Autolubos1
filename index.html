<!DOCTYPE html>

<body>

<header class="fade">
    <div class="lang-switch">
        <button data-lang="lt">LT</button>
        <button data-lang="lv">LV</button>
        <button data-lang="ee">EE</button>
        <button data-lang="ru">RU</button>

</header>

<section class="calculator fade">
    <h2 id="calcTitle"></h2>
    <div class="grid">
        <button data-type="hatchback"></button>
        <button data-type="sedan"></button>
        <button data-type="wagon"></button>
        <button data-type="suv"></button>
        <button data-type="minivan"></button>
    </div>

<section class="additional-services fade">
    <h2 id="additionalTitle"></h2>
    <div class="services-grid">
        <!-- ПЕРВЫЙ БЛОК - теперь просто заголовок и текст как в других -->
        <div class="service-item">
            <h3 id="doorCardsTitle"></h3>
            <div class="service-content">
                <div class="service-price-item">
                    <span class="service-type">Hatchback:</span>
                    <span class="service-price" id="doorCardsHatchback"></span>
                </div>
                <div class="service-price-item">
                    <span class="service-type">Sedan:</span>
                    <span class="service-price" id="doorCardsSedan"></span>
                </div>
                <div class="service-price-item">
                    <span class="service-type">Wagon:</span>
                    <span class="service-price" id="doorCardsWagon"></span>
                </div>
                <div class="service-price-item">
                    <span class="service-type">SUV:</span>
                    <span class="service-price" id="doorCardsSuv"></span>
                </div>
                <div class="service-price-item">
                    <span class="service-type">Minivan:</span>
                    <span class="service-price" id="doorCardsMinivan"></span>
                </div>
            </div>
        </div>
        
        <!-- ВТОРОЙ БЛОК - Солнцезащитные козырьки -->
        <div class="service-item">
            <h3 id="sunVisorsTitle"></h3>
            <div class="service-content">
                <p id="sunVisors"></p>
            </div>
        </div>
        
        <!-- ТРЕТИЙ БЛОК - Все стойки -->
        <div class="service-item">
            <h3 id="pillarsTitle"></h3>
            <div class="service-content">
                <p id="pillars"></p>
            </div>
        </div>
        
        <!-- ЧЕТВЕРТЫЙ БЛОК - Ручки потолка -->
        <div class="service-item">
            <h3 id="handlesTitle"></h3>
            <div class="service-content">
                <p id="handles"></p>
            </div>
        </div>
    </div>
</section>


<!-- ================= PANORAMA & SUNROOF REPAIR ================= -->

    <p class="panorama-intro" id="panoramaIntro"></p>

    <!-- Tabs: типы неисправностей -->
    <div class="panorama-tabs" id="panoramaTabs">

        <button class="tab-btn" data-tab="leak"></button>

        <button class="tab-btn" data-tab="noise"></button>

    <!-- Accordion: этапы работ -->
    <h3 class="panorama-subtitle" id="panoramaStepsTitle"></h3>
    <div class="panorama-accordion" id="panoramaAccordion">
        <div class="acc-item">
            <button class="acc-header" data-acc="0"></button>
            <div class="acc-body"><p></p></div>
        </div>
        <div class="acc-item">
            <button class="acc-header" data-acc="1"></button>
